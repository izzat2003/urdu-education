<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guruhlar | Urdu Education</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'IBM Plex Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="mobile-header"></div>
<div class="flex min-h-screen">
    <div id="sidebar" class="hidden md:block flex-shrink-0"></div>

    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <div class="max-w-6xl">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Guruhlar boshqaruvi</h1>
                    <p class="text-gray-500 text-sm mt-0.5">Guruh yarating → Talaba qo'shing → O'qituvchi biriktiring</p>
                </div>
                <button onclick="openModal('createGroupModal')"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-sm flex items-center gap-2">
                    <span class="text-lg">+</span> Yangi guruh
                </button>
            </div>

            <!-- Groups grid -->
            <div id="groupsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-12 text-gray-400">Yuklanmoqda...</div>
            </div>
        </div>
    </main>
</div>

<!-- Guruh yaratish modali -->
<div id="createGroupModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
    <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md z-10">
        <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
            <h2 class="text-lg font-bold text-gray-900">Yangi guruh yaratish</h2>
            <button onclick="closeModal('createGroupModal')" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <form id="createGroupForm" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Guruh nomi *</label>
                <input type="text" name="name" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
                    placeholder="Masalan: 22-DI-1"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">O'quv yili *</label>
                <input type="number" name="year" required value="2025" min="2020" max="2030"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">O'qituvchi</label>
                <select name="teacher"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 bg-white">
                    <option value="">Keyinroq biriktirish</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Tavsif</label>
                <textarea name="description" rows="2"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 resize-none"
                    placeholder="Ixtiyoriy tavsif..."></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeModal('createGroupModal')"
                    class="flex-1 border border-gray-200 text-gray-700 py-2.5 rounded-xl font-medium text-sm hover:bg-gray-50">
                    Bekor qilish
                </button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-semibold text-sm transition-colors">
                    Yaratish
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Talaba qo'shish modali -->
<div id="addStudentModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
    <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg z-10 max-h-[85vh] flex flex-col">
        <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
            <div>
                <h2 class="text-lg font-bold text-gray-900">Talabalar qo'shish</h2>
                <p class="text-sm text-gray-500" id="addStudentGroupName">Guruh: –</p>
            </div>
            <button onclick="closeModal('addStudentModal')" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div class="p-4 border-b border-gray-100 flex-shrink-0">
            <input type="text" id="studentSearch" placeholder="Talaba qidirish..."
                class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
        </div>
        <div class="flex-1 overflow-y-auto">
            <div id="studentsList" class="p-4 space-y-2">
                <p class="text-center text-gray-400 text-sm py-4">Yuklanmoqda...</p>
            </div>
        </div>
        <div class="px-6 py-4 border-t border-gray-100 flex gap-3 flex-shrink-0">
            <div class="flex-1 text-sm text-gray-500 flex items-center">
                <span id="selectedCount">0</span> ta tanlandi
            </div>
            <button onclick="addSelectedStudents()" id="addStudentsBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-semibold text-sm disabled:opacity-50 transition-colors">
                Qo'shish
            </button>
        </div>
    </div>
</div>

<!-- Guruh tafsilotlari -->
<div id="groupDetailModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
    <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl z-10 max-h-[90vh] flex flex-col overflow-hidden">
        <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
            <h2 class="text-lg font-bold text-gray-900" id="groupDetailTitle">Guruh</h2>
            <button onclick="closeModal('groupDetailModal')" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div id="groupDetailContent" class="flex-1 overflow-y-auto p-6">
            <p class="text-center text-gray-400">Yuklanmoqda...</p>
        </div>
    </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/components/layout.js"></script>
<script>
    const user = requireAuth(['admin']);
    if (user) {
        renderLayout('sidebar');
        loadData();
    }

    let allStudents = [];
    let selectedStudents = new Set();
    let activeGroupId = null;

    async function loadData() {
        await Promise.all([loadGroups(), loadTeachersForForm(), loadAllStudents()]);
    }

    async function loadGroups() {
        const data = await GroupsAPI.list();
        const groups = data.results || data;
        renderGroups(groups);
    }

    async function loadTeachersForForm() {
        const teachers = await UsersAPI.teachers();
        const select = document.querySelector('[name="teacher"]');
        teachers.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = t.full_name;
            select.appendChild(opt);
        });
    }

    async function loadAllStudents() {
        allStudents = await UsersAPI.students();
    }

    function renderGroups(groups) {
        const grid = document.getElementById('groupsGrid');

        if (!groups.length) {
            grid.innerHTML = `
            <div class="col-span-full text-center py-16">
                <div class="text-5xl mb-3">🏫</div>
                <p class="text-gray-500 text-lg font-medium">Guruhlar yo'q</p>
                <p class="text-gray-400 text-sm mt-1">Birinchi guruhni yarating</p>
            </div>`;
            return;
        }

        grid.innerHTML = groups.map(g => `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
            <div class="p-5">
                <div class="flex items-start justify-between mb-3">
                    <div>
                        <h3 class="font-bold text-gray-900 text-lg">${g.name}</h3>
                        <p class="text-xs text-gray-400 mt-0.5">${g.year}-yil</p>
                    </div>
                    <span class="text-2xl">🏫</span>
                </div>
                <div class="space-y-1.5 mb-4">
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <span>👨‍🏫</span>
                        <span>${g.teacher_name || '<span class="text-gray-400 italic">Biriktirilmagan</span>'}</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <span>👥</span>
                        <span>${g.student_count || 0} ta talaba</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openGroupDetail(${g.id}, '${g.name}')"
                        class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-700 py-2 rounded-xl text-sm font-medium transition-colors">
                        Ko'rish
                    </button>
                    <button onclick="openAddStudents(${g.id}, '${g.name}')"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-semibold transition-colors">
                        + Talaba
                    </button>
                </div>
            </div>
        </div>`).join('');
    }

    // Guruh yaratish
    document.getElementById('createGroupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const data = {
            name: form.name.value.trim(),
            year: parseInt(form.year.value),
            description: form.description.value.trim(),
        };
        if (form.teacher.value) data.teacher = parseInt(form.teacher.value);

        try {
            await GroupsAPI.create(data);
            closeModal('createGroupModal');
            form.reset();
            showToast('Guruh yaratildi!', 'success');
            loadGroups();
        } catch (err) {
            showToast('Xato: ' + err.message, 'error');
        }
    });

    // Talaba qo'shish modali
    function openAddStudents(groupId, groupName) {
        activeGroupId = groupId;
        selectedStudents = new Set();
        document.getElementById('addStudentGroupName').textContent = 'Guruh: ' + groupName;
        renderStudentsList(allStudents);
        openModal('addStudentModal');
    }

    function renderStudentsList(students) {
        const container = document.getElementById('studentsList');
        container.innerHTML = students.map(s => `
        <label class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 cursor-pointer transition-colors">
            <input type="checkbox" value="${s.id}" class="student-checkbox w-4 h-4 text-blue-600 rounded"
                ${selectedStudents.has(s.id) ? 'checked' : ''}
                onchange="toggleStudent(${s.id})"/>
            <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold text-sm flex-shrink-0">
                ${(s.full_name || 'T')[0].toUpperCase()}
            </div>
            <div>
                <div class="font-medium text-gray-900 text-sm">${s.full_name}</div>
                <div class="text-xs text-gray-400">${s.username}</div>
            </div>
        </label>`).join('') || '<p class="text-center text-gray-400 py-4">Talabalar topilmadi</p>';

        document.getElementById('selectedCount').textContent = selectedStudents.size;
    }

    function toggleStudent(id) {
        if (selectedStudents.has(id)) selectedStudents.delete(id);
        else selectedStudents.add(id);
        document.getElementById('selectedCount').textContent = selectedStudents.size;
    }

    document.getElementById('studentSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = allStudents.filter(s =>
            s.full_name.toLowerCase().includes(q) || s.username.toLowerCase().includes(q)
        );
        renderStudentsList(filtered);
    });

    async function addSelectedStudents() {
        if (!selectedStudents.size) { showToast('Talabalarni tanlang', 'warning'); return; }
        try {
            const result = await GroupsAPI.addStudents(activeGroupId, [...selectedStudents]);
            closeModal('addStudentModal');
            showToast(result.message, 'success');
            loadGroups();
        } catch (err) {
            showToast('Xato yuz berdi', 'error');
        }
    }

    // Guruh tafsilotlari
    async function openGroupDetail(groupId, groupName) {
        document.getElementById('groupDetailTitle').textContent = groupName + ' guruhi';
        openModal('groupDetailModal');

        try {
            const group = await GroupsAPI.get(groupId);
            const students = group.students_list || [];

            document.getElementById('groupDetailContent').innerHTML = `
            <div class="mb-4 grid grid-cols-2 gap-3">
                <div class="bg-gray-50 rounded-xl p-3 text-sm">
                    <div class="text-gray-500 text-xs mb-1">O'qituvchi</div>
                    <div class="font-semibold text-gray-900">${group.teacher_name || 'Biriktirilmagan'}</div>
                </div>
                <div class="bg-gray-50 rounded-xl p-3 text-sm">
                    <div class="text-gray-500 text-xs mb-1">Talabalar soni</div>
                    <div class="font-semibold text-gray-900">${students.length} ta</div>
                </div>
            </div>
            <h3 class="font-semibold text-gray-900 mb-3">Talabalar ro'yxati</h3>
            <div class="space-y-2">
                ${students.length ? students.map((s, i) => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="text-gray-400 text-sm w-6 text-center">${i + 1}</span>
                        <div>
                            <div class="font-medium text-gray-900 text-sm">${s.full_name}</div>
                            <div class="text-xs text-gray-400 font-mono">${s.username}</div>
                        </div>
                    </div>
                    <button onclick="removeStudent(${groupId}, ${s.id}, this)"
                        class="text-xs text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-1 rounded-lg transition-colors">
                        Chiqarish
                    </button>
                </div>`).join('') : '<p class="text-center text-gray-400 py-6 text-sm">Hali talabalar yo\'q</p>'}
            </div>`;
        } catch (err) {
            document.getElementById('groupDetailContent').innerHTML = '<p class="text-red-500 text-center">Xato yuz berdi</p>';
        }
    }

    async function removeStudent(groupId, studentId, btn) {
        if (!confirm('Talabani guruhdan chiqarmoqchimisiz?')) return;
        try {
            await GroupsAPI.removeStudent(groupId, studentId);
            btn.closest('.flex.items-center.justify-between').remove();
            showToast('Chiqarildi', 'success');
        } catch (err) {
            showToast('Xato', 'error');
        }
    }
</script>
</body>
</html>
