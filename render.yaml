# render.yaml — Urdu Education Backend (Render.com)
services:
  - type: web
    name: urdu-education-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn urdu_platform.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: urdu-education-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: urdu-education-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://urdu-education.netlify.app

databases:
  - name: urdu-education-db
    databaseName: urdu_education
    user: urdu_admin
    plan: free
